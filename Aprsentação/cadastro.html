<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro do Mentorado</title>
	<link rel="stylesheet" href="css/cabecalho.css">
	<link rel="stylesheet" href="css/cadastro.css">
	<script src="js/menu.js" defer></script>
</head>
<body>
	<div class="container-cabeçalho">
		<h1>MENTORIA LIVRE</h1>

		<div class="container-botoes">
			<div class="menu-wrapper">
				<button type="button" class="btn-cadastro" id="btn-menu" aria-expanded="false" aria-controls="menu-navegacao">MENU</button>
				<nav class="menu-navegacao" id="menu-navegacao" aria-label="Navegação principal">
					<a href="index.html">INÍCIO</a>
					<a href="login.html">LOGIN</a>
					<a href="cadastro-mentor.html">CADASTRO DO MENTOR</a>
					<a href="perfilMentor.html">PERFIL DO MENTOR</a>
					<a href="cadastro.html">CADASTRO DO MENTORADO</a>
					<a href="criar-vagas.html">CRIAR VAGAS</a>
				</nav>
			</div>
		</div>
	</div>
	<hr>

	<main class="container-cadastro">
		<div class="lado-esquerdo">
			<img src="assets/ChatGPT Image 31_08_2026, 09_41_18.png" alt="Ilustração da Mentoria Livre">
		</div>

		<div class="lado-direito">
			<h2>CADASTRO DO MENTORADO</h2>
			<form>
				<label for="nome">Nome:</label>
				<input type="text" id="nome" name="nome" autocomplete="name" required>

				<label for="data-nascimento">Data de nascimento:</label>
				<input type="date" id="data-nascimento" name="data-nascimento" required>

				<label for="email">E-mail:</label>
				<input type="email" id="email" name="email" autocomplete="email" required>

				<label for="senha">Senha:</label>
				<input type="password" id="senha" name="senha" autocomplete="new-password" required>

				<div class="botoes-cadastro">
					<a href="login.html" class="botao-finalizar">FINALIZAR</a>
					<a href="cadastro-mentor.html" class="botao-mentorado">MENTOR</a>
				</div>
			</form>
		</div>
	</main>
</body>
</html>
